name: "Jamundí Data Extraction"

on:
  schedule:
    # Run every day at 8:00 AM UTC
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/extract_jamundi.yml"
  workflow_dispatch:
    # Allow manual triggers
    inputs:
      full:
        description: 'Run full extraction'
        required: True
        default: 'true'

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      OBS_USER: ${{ secrets.OBS_USER }}
      OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
      OBS_HEADLESS: "True"
      LOG_LEVEL: "INFO"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Extraction Pipeline
        id: extraction
        run: |
          python -m src.pipelines.run_full_extract --full

      - name: Check for Data Updates
        run: |
          python -m src.reporting.check_changes

      - name: Reportar estado al Centro de fuentes SISC
        if: always()
        continue-on-error: true
        env:
          SISC_API_URL: "https://sisc-backend.onrender.com/api"
          SISC_MONITOR_OUTCOME: ${{ steps.extraction.outcome }}
        run: python -m src.integrations.sisc_heartbeat

      - name: Generate PDF Report
        if: env.DATA_CHANGED == 'true'
        run: |
          python -m src.reporting.generate_pdf_report

      - name: Send Email Report
        if: env.DATA_CHANGED == 'true'
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python -m src.reporting.send_email

      - name: Commit New Data Hash
        if: env.DATA_CHANGED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/data_hash.txt
          git commit -m "Actualizando hash de datos detectados [skip ci]" || echo "No changes to commit"
          git pull --rebase
          git push

      - name: Upload Extracted Data
        uses: actions/upload-artifact@v4
        with:
          name: jamundi-extracted-data
          path: data/final/
          retention-days: 7

      - name: Upload Logs and Errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraction-logs
          path: |
            logs/
            data/raw/
          retention-days: 3
